<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f8fb">
  <title>АналитикаМед — временные технические неполадки</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #f4f8fb; color: #17324b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
    .wrap { width: min(100% - 48px, 1080px); margin-inline: auto; }
    header { padding-top: 36px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 720; letter-spacing: -.6px; }
    .brand svg { width: 38px; height: 38px; flex: none; }
    main { flex: 1; display: grid; place-items: center; padding-block: 64px; }
    .card { width: min(100%, 680px); padding: 52px; background: #fff; border: 1px solid #dce7ee; border-radius: 24px; box-shadow: 0 16px 64px #17324b08; }
    .icon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: #eaf5f6; color: #087f8c; margin-bottom: 28px; }
    .icon svg { width: 32px; height: 32px; }
    .label { margin: 0 0 14px; color: #527485; font-size: 12px; font-weight: 650; letter-spacing: 1.6px; text-transform: uppercase; }
    h1 { margin: 0 0 24px; font-size: clamp(28px, 4vw, 38px); line-height: 1.16; font-weight: 700; letter-spacing: -1px; text-wrap: balance; }
    p { margin: 0 0 16px; color: #526878; font-size: 17px; line-height: 1.7; }
    .apology { margin: 0; }
    .note { margin-top: 30px; padding-top: 22px; border-top: 1px solid #e5edf2; font-size: 14px; line-height: 1.6; color: #687f8d; }
    footer { padding-bottom: 28px; color: #6c8190; font-size: 13px; }
    @media (max-width: 520px) { .wrap { width: calc(100% - 32px); } header { padding-top: 24px; } .brand { font-size: 21px; } main { padding-block: 40px; } .card { padding: 30px 24px; border-radius: 20px; } p { font-size: 16px; } h1 { letter-spacing: -.6px; } }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#087f8c"/><path d="M10 23h5l3-10 5 16 3-9h4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>АналитикаМед</span>
    </div>
  </header>
  <main class="wrap">
    <section class="card" aria-labelledby="page-title">
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M25.5 11a10.5 10.5 0 1 0 .8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M26 5v7h-7M16 10v7l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 id="page-title">Временные технические неполадки</h1>
      <p>В настоящий момент платформа недоступна по техническим причинам на стороне хостинг-провайдера. Работа сервиса будет восстановлена после устранения сбоя.</p>
      <p class="apology">Приносим извинения за временные неудобства.</p>
    </section>
  </main>
  <footer class="wrap">analitikamed.ru</footer>
</body>
</html>
